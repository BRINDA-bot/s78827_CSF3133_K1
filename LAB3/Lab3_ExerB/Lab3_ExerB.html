<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking - Campus Cinema</title>
</head>
<body>
    <!-- 
    ==================================================================
    PART 1: BUG LIST & ERROR IDENTIFICATION
    ==================================================================
    Error 1 (Line 1): Incomplete DOCTYPE declaration. Changed <!DOCTYPE> to <!DOCTYPE html>.
    Error 2 (Line 9): Mismatched closing tags. Changed <h1>...<span>...</h1></span> to <h1>...<span>...</span></h1>.
    Error 3 (Lines 11 & 36): Inline <span> tag used as a main content container. Changed <span id="content"> to <div id="content">.
    Error 4 (Line 14): String concatenation in oninput calculation ("2" + "3" = "23"). Added parseInt() to treat inputs as numbers.
    Error 5 (Line 18): Misspelled input type "emial". Fixed to type="email".
    Error 6 (Lines 22 & 23): Datalist ID mismatch (list="movies" vs id="movielist"). Changed datalist id to "movies".
    Error 7 (Line 33): Inverted range slider values (min="5" max="1"). Fixed to min="1" max="5".
    Error 8 (Line 34): Incorrect 'for' attribute ID ("kid" instead of "child"). Fixed to for="adult child".
    Error 9 (Line 38): Incorrect capitalization in HTML entity &Copy;. Fixed to &copy;.
    ==================================================================
    -->

    <!-- Header Section -->
    <div id="header">
        <h1>e-Ticket <span>- Your Campus Cinema</span></h1>
    </div>
    
    <!-- Main Content Section -->
    <div id="content">
        <h2>Book Your Ticket</h2>
        <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>

        <!-- Booking Form with dynamic calculations -->
        <form action="booking.php" method="post" oninput="
            total.value = parseInt(adult.value || 0) + parseInt(child.value || 0);
            price.value = (parseInt(adult.value || 0) * 12) + (parseInt(child.value || 0) * 8);
        ">
            <!-- Customer Details -->
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br><br>

            <label for="phone">Phone Number: </label>
            <input type="tel" id="phone" name="phone" placeholder="012-3456789" required><br><br>

            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" placeholder="student@campus.edu" required><br><br>

            <!-- Show Date & Time -->
            <label for="date">Show date: </label>
            <input type="date" id="date" name="date" required><br><br>

            <label for="time">Show time: </label>
            <input type="time" id="time" name="time" required><br><br>

            <!-- Movie Selection -->
            <label for="movie">Movie: </label>
            <input id="movie" name="movie" list="movies" placeholder="Select or type a movie">
            <datalist id="movies">
                <option value="Space Rangers">
                <option value="Kampung Comedy">
                <option value="Cyber Odyssey">
            </datalist><br><br>

            <!-- Ticket Quantities -->
            <label for="adult">Adult tickets (RM 12.00): </label>
            <input type="number" id="adult" name="adult" value="0" min="0"><br><br>

            <label for="child">Child tickets (RM 8.00): </label>
            <input type="number" id="child" name="child" value="0" min="0"><br><br>

            <!-- Rating Slider -->
            <label for="rating">Rate our service: </label><br>
            <input type="range" id="rating" name="rating" min="1" max="5" step="1" value="3"><br><br>

            <!-- Output Calculations -->
            <p>Total tickets: <output name="total" for="adult child">0</output></p>
            <p>Total price: RM <output name="price" for="adult child">0</output></p>

            <input type="submit" value="Book Now">
        </form>
    </div>

    <!-- Sidebar Section (Part 2 Extension) -->
    <div id="sidebar">
        <h3>Now Showing</h3>
        <ul>
            <li>
                <strong>Space Rangers</strong> &ndash; <span>PG-13</span> 
                (<a href="https://www.youtube.com/results?search_query=space+rangers" target="_blank">Watch Trailer</a>)
            </li>
            <li>
                <strong>Kampung Comedy</strong> &ndash; <span>P13</span> 
                (<a href="https://www.youtube.com/results?search_query=kampung+comedy" target="_blank">Watch Trailer</a>)
            </li>
            <li>
                <strong>Cyber Odyssey</strong> &ndash; <span>18</span> 
                (<a href="https://www.youtube.com/results?search_query=cyber+odyssey" target="_blank">Watch Trailer</a>)
            </li>
        </ul>
    </div>
</body>
</html>
