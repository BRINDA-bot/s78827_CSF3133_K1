<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Student Grade Calculator</h2>

        <!-- Form with return checkMark() so page does not reload on submit -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="mark">Mark (0-100):</label>
                <input type="text" id="mark" name="mark" placeholder="Enter mark (0-100)">
            </div>

            <div class="button-group">
                <button type="submit">Check Grade</button>
                <!-- Extended feature: Random Mark button -->
                <button type="button" onclick="generateRandomMark()">Random Mark</button>
            </div>
        </form>

        <!-- Result and Date/Time display -->
        <p id="result"></p>
        <p id="checkedTime"></p>

        <!-- Fixed function name case: showTable() -->
        <button type="button" class="table-btn" onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Fixed external JS filename: grade.js -->
    <script src="grade.js"></script>
</body>
</html>
